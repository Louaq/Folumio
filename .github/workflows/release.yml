name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: release-master
  queue: max

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create next patch release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const { owner, repo } = context.repo;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner, repo, per_page: 100,
            });
            // Rerunning a successful push must not publish another version.
            if (releases.some(release => release.target_commitish === context.sha)) {
              core.info('This commit already has a release.');
              return;
            }

            const tags = await github.paginate(github.rest.repos.listTags, {
              owner, repo, per_page: 100,
            });
            const packageVersion = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
            const versions = [packageVersion, ...tags.map(tag => tag.name)]
              .filter(version => /^v?\d+\.\d+\.\d+$/.test(version))
              .map(version => version.replace(/^v/, '').split('.').map(Number))
              .sort((a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2]);
            const [major, minor, patch] = versions.at(-1);
            const tag = `v${major}.${minor}.${patch + 1}`;

            const { data: release } = await github.rest.repos.createRelease({
              owner, repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: tag,
              generate_release_notes: true,
              draft: false,
              prerelease: false,
            });
            core.info(`Published ${release.html_url}`);
